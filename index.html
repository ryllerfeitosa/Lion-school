<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Lion School</title>
</head>

<body class="bg-gray-100 min-h-screen justify-between flex flex-col">

    <header class="bg-[#3347B0] text-white px-20 py-6 w-auto">
        <div class="flex items-center justify-between">

            <div class="flex items-center gap-3">
                <img src="img/logo-image.png" alt="Logo da empresa" class="h-20 w-auto">
                <h1 class="text-xl font-bold">Lion School</h1>
            </div>

            <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity">
                <img src="img/logo-sair.png" alt="Icone do botao sair" class="h-12 w-auto">
                <h2 class="font-xl text-base">Sair</h2>
            </div>
        </div>
    </header>

    <main class="flex justify-between m-25">
        <div>
            <h1 class="flex gap-3 text-[5.5rem]">Escolha um <p class="text-[#3347B0] text-[5.5rem]">curso</p></h1>
            <h2 class="text-[5.5rem]">para gerenciar</h2>
            <img src="img/layout_telas.png" alt="Layout de telas" class="h-100 w-auto pt-2">
        </div>
        <div>
            <img class="h-175 w-auto" src="img/student.png" alt="Layout de estudante em tela home">
        </div>
        <div class="flex flex-col gap-2 justify-center">
            <button class=" flex gap-1 justify-center items-center bg-[#3347B0] hover:bg-blue-700 text-white font-semibold text-xl pt-3 pb-3 h-50 w-100 rounded-lg shadow-md transition-all duration-200 ease-in-out active:scale-95 disabled:opacity-50">
            <img src="img/Icone_DS.png" alt="Icone do botao de DS" class="h-5 w-auto">DS</button>
            <button class="flex gap-1 justify-center items-center bg-[#3347B0] hover:bg-blue-700 text-white font-semibold text-xl pt-3 pb-3 w-60 h-50 w-100 rounded-lg shadow-md transition-all duration-200 ease-in-out active:scale-95 disabled:opacity-50">
            <img src="img/Icone_redes.png" alt="Icone do botao de redes" class="h-5 w-auto">REDES</button>
        </div>
    </main>

    <footer class="flex items-center justify-between bg-[#3347B0] text-white px-15 py-4">
        <div class="flex gap-3">
            <div class="flex flex-col gap-4">
                <div class="flex items-center gap-3">
                    <img src="img/telefone.png" alt="Icone de telefone" class="h-5 w-auto">
                </div>
                <div class="flex items-center gap-3">
                    <img src="img/icon-email.png" alt="Icone de email" class="h-5 w-auto">
                </div>
                <div class="flex items-center gap-3">
                    <img src="img/localizacao.png" alt="Icone de localizacao" class="h-5 w-auto">
                </div>
            </div>
            <div class="flex flex-col gap-3">
                <p class="font-lg">(11) 4774-4700</p>
                <p class="font-lg">lionschool@gmail.com</p>
                <p class="font-lg">Rua tcc, 211, Centro, Jandira</p>
            </div>
        </div>
        <div><p class="font-medium">Copyright © 2026 | Fernando Leonid</p></div>
        <div class="flex gap-3 h-5 w-auto">
            <img src="img/youtube.png" alt="Icone do youtube">
            <img src="img/twitter.png" alt="Icone do twitter">
            <img src="img/instagram.png" alt="Icone do instagram">
            <img src="img/facebook.png" alt="Icone do facebook">
        </div>
    </footer>

</body>

</html>
