<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Lion School</title>
</head>

<body class="bg-gray-100">

    <header class="bg-[#3347B0] text-white px-6 py-4">
        <div class="flex items-center justify-between">

            <div class="flex items-center gap-3">
                <img src="img/logo-image.png" alt="Logo da empresa" class="h-10 w-auto">
                <h1 class="text-xl font-bold">Lion School</h1>
            </div>

            <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity">
                <img src="img/logo-sair.png" alt="Icone do botao sair" class="h-5 w-auto">
                <h2 class="font-medium text-base">Sair</h2>
            </div>
        </div>
    </header>

    <main class="bg-red">
        <h2>teste</h2>
    </main>

    <footer class="flex items-center justify-between bg-[#3347B0] text-white px-15 py-4">
        <div class="flex gap-3">
            <div class="flex flex-col gap-4">
                <div class="flex items-center gap-3">
                    <img src="img/telefone.png" alt="Icone de telefone" class="h-5 w-auto">
                </div>
                <div class="flex items-center gap-3">
                    <img src="img/icon-email.png" alt="Icone de email" class="h-5 w-auto">
                </div>
                <div class="flex items-center gap-3">
                    <img src="img/localizacao.png" alt="Icone de localizacao" class="h-5 w-auto">
                </div>
            </div>
            <div class="flex flex-col gap-3">
                <p class="font-medium">(11) 4774-4700</p>
                <p class="font-medium">lionschool@gmail.com</p>
                <p class="font-medium">Rua tcc, 211, Centro, Jandira</p>
            </div>
        </div>
        <div><p class="font-medium">Copyright © 2026 | Fernando Leonid</p></div>
        <div class="flex gap-3 h-5 w-auto">
            <img src="img/youtube.png" alt="Icone do youtube">
            <img src="img/twitter.png" alt="Icone do twitter">
            <img src="img/instagram.png" alt="Icone do instagram">
            <img src="img/facebook.png" alt="Icone do facebook">
        </div>
    </footer>

</body>

</html>
